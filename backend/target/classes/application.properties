# ==========================================
# CONFIGURACIÓN DE CONEXIÓN SUPABASE
# ==========================================

# 1. URL de la base de datos (JDBC)
# Reemplaza 'TU_PROYECTO_ID' con el ID de tu proyecto en Supabase (ej: xyzabc)
# Reemplaza 'TU_PASSWORD' con la contraseña que definiste al crear la base de datos
spring.datasource.url=jdbc:postgresql://db.TU_PROYECTO_ID.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=TU_PASSWORD

# 2. Driver y JPA
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Seguridad JWT
# Puedes dejar esta clave por defecto para desarrollo o cambiarla por una cadena larga aleatoria
odontolyt.jwt.secret=9a4f2c8d3b7a1e5f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2u3v4w5x6y7z8a9b0c1
odontolyt.jwt.expiration=86400000

# 4. Google reCAPTCHA
# Estas son las claves de prueba de Google. 
# Para producción, genera tus propias claves en: https://www.google.com/recaptcha/admin
